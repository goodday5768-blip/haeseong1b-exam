  async function openBytes(key, buf) {   // key: CryptoKey, buf: ArrayBuffer|Uint8Array(iv + 본문) → ArrayBuffer
    const b = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
    return crypto.subtle.decrypt({name: 'AES-GCM', iv: b.slice(0, 12)}, key, b.slice(12));

  const MSG_NET = '처음 쓰는 기기는 인터넷 연결이 필요합니다. 통신 상태를 확인한 뒤 다시 시도하세요.';
  const MSG_SRV = '지금은 시작할 수 없습니다. 선생님께 문의하세요.';
  const MSG_FAIL = '내용을 여는 데 실패했습니다. 앱을 새로 고친 뒤 다시 시도하세요.';
  const MSG_OLD = '이 브라우저에서는 열 수 없습니다. 최신 Safari 또는 Chrome으로 여세요.';

  }

  async function imgUrl(key, path, type) {
    if (!key || !/\.bin$/.test(path)) return path;

      const r = await fetch(path); if (!r.ok) throw new Error('http ' + r.status);
      const buf = await openBytes(key, await r.arrayBuffer());
      return URL.createObjectURL(new Blob([buf], {type: type || 'image/webp'}));
    })();
    urls.set(path, p);
    try { const u = await p; urls.set(path, u); return u; } catch (e) { urls.delete(path); throw e; }
  }
  let io = null; const pend = new WeakMap();
  function lazy(root, key) {   // root 안의 img[data-enc]·audio[data-enc]를 화면에 보일 때 받아 넣는다
    const load = el => { if (el.dataset.done) return; el.dataset.done = '1'; const au = el.tagName === 'AUDIO';
      imgUrl(key, el.dataset.enc, el.dataset.type || (au ? 'audio/mp4' : '')).then(u => { el.src = u; })
        .catch(() => { if (au) el.insertAdjacentHTML('afterend', '<div class="muted">음원을 받지 못했습니다. 통신 상태를 확인하세요.</div>'); else el.alt = '그림을 받지 못했습니다'; }); };
    if (!('IntersectionObserver' in window)) { root.querySelectorAll('img[data-enc], audio[data-enc]').forEach(load); return; }

  }
  const SIGN_FIELDS = ['name', 'device', 'score', 'correct', 'total', 'pass', 'time'];
  const canon = b => SIGN_FIELDS.map(k => b[k] === undefined || b[k] === null ? '' : String(b[k])).join('|');
  async function signBody(keyHex, body) {   // 기록 서명(2026-10-08): 채점 기록을 앱 열쇠로 HMAC-SHA256 → 서버가 검증, 위조 기록·가짜 합격 문자 차단
    const k = await crypto.subtle.importKey('raw', hex2b(keyHex), {name: 'HMAC', hash: 'SHA-256'}, false, ['sign']);

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const HUE = [['#0e7c66', '#3fd1bd'], ['#2374e1', '#5fa8ff'], ['#8a2be2', '#c77dff'], ['#e0417c', '#ff7aa8'], ['#ef7d00', '#ffb347'], ['#2b9348', '#6fcf7f']];
function renderHome() {
  window.scrollTo(0, 0);
  const cards = D.groups.map((g, i) => { const h = HUE[i % HUE.length]; return `<a class="gc" href="#g${i}" style="background:linear-gradient(130deg,${h[0]},${h[1]})"><b>${esc(g.name)}</b><span>${g.pages.length}지문 한 번에 보기</span></a>`; }).join('');
  $('#app').innerHTML = `<div class="hero"><small>${esc(D.school)}</small><h1>지문분석 아잉카</h1><p>${esc(D.sub)}</p></div><div class="home">${D.book ? `<a class="res" href="${esc(D.book)}">📘 시험대비 교재 보기<em>›</em></a>` : ''}<div class="hh">범위를 고르세요</div><div class="gg">${cards}</div></div>`;
}
function renderGroup(i) {
  const g = D.groups[i]; if (!g) return renderHome();
  const h = HUE[i % HUE.length]; document.documentElement.style.setProperty('--h1', h[0]); document.documentElement.style.setProperty('--h2', h[1]);
  const pages = g.pages.map((p, k) => `<article id="a${k}"><div class="ah"><span class="lb">${esc(p.lab || k + 1)}</span>${p.ko ? `<div class="k">${esc(p.ko)}</div>` : ''}${p.en ? `<div class="e">${esc(p.en)}</div>` : ''}</div>${p.sum ? `<div class="sm"><span>SUMMARY</span>${esc(p.sum)}</div>` : ''}<div class="pg" style="aspect-ratio:${p.r}"><img data-enc="ainca/${String(g.from + k).padStart(3, '0')}.bin" alt="${k + 1}번째 지문"></div></article>`);
  $('#app').innerHTML = `<div class="top"><div class="tr"><a class="bk" href="#">‹ 목차</a><b>${esc(g.name)}</b><span class="pn">${g.pages.length}지문</span></div><div class="chips">${g.pages.map((p, k) => `<a data-k="${k}">${esc(chip(p, k))}</a>`).join('')}</div></div><main>${pages.join('')}</main>`;
  document.querySelector('.chips').onclick = e => { const a = e.target.closest('[data-k]'); if (a) { document.getElementById('a' + a.dataset.k).scrollIntoView(); } };
  window.scrollTo(0, 0); UNLOCK.lazy($('#app'), IMGKEY); saveMem();
}
function chip(p, k) { const m = String(p.lab || '').match(/^(\S+(?:\s\d+)?)/); return m ? m[1] : k + 1; }
let memIO = null;
function saveMem() {   /* 큰 그림이라 화면에서 멀어진 쪽은 메모리에서 내렸다가 가까워지면 다시 넣는다(아이패드에서 한 범위 27쪽을 계속 내려도 안 튕기게) */
  if (memIO) memIO.disconnect();
  memIO = new IntersectionObserver(es => es.forEach(e => { const im = e.target;
    if (e.isIntersecting) { if (im.dataset.u && !im.getAttribute('src')) im.src = im.dataset.u; }
    else if (im.getAttribute('src')) { im.dataset.u = im.src; im.removeAttribute('src'); } }), {rootMargin: '2500px 0px'});
  document.querySelectorAll('.pg img').forEach(im => memIO.observe(im));
}
function route() { const m = location.hash.match(/^#g(\d+)$/); if (m) renderGroup(+m[1]); else renderHome(); }
function renderBook() { window.addEventListener('hashchange', route); route(); }
const NS = 'ex:' + D.salt + ':';
const exst = {
  get(k, d) { try { const v = localStorage.getItem(NS + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(NS + k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
const KEYST = {get: () => exst.get('k', ''), set: v => exst.set('k', v), del: () => exst.set('k', '')};
const pad = n => String(n).padStart(2, '0');
const fmtTime = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const cleanName = s => s.replace(/\s+/g, ' ').trim();
const DEVICE = (() => { let d = exst.get('device', ''); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random()).slice(0, 8); exst.set('device', d); } return d; })();
let IMGKEY = null;
async function gate(name, range) {     // 시험 앱과 같은 시작 판정(이름·기기ID 짝) + 열쇠 — 토익 워크북 wb_template와 같은 코드
  if (!D.reportUrl) return {allow: true};
  for (let i = 0; i < 2; i++) {
    if (i) { const m = document.getElementById('msg'); if (m) m.textContent = '서버 응답이 늦어 한 번 더 확인하는 중…'; }
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 60000);
    try {
      const r = await fetch(D.reportUrl, {method: 'POST', signal: ctl.signal, headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify({event: 'start', name, range, device: DEVICE, app: D.title, salt: D.enc ? D.salt : undefined, time: fmtTime(new Date()), ua: navigator.userAgent.slice(0, 120)})});

  }
}
function nameOk() {
  const name = cleanName($('#name').value);
  if (!name) { $('#msg').textContent = '이름을 먼저 입력하세요.'; $('#name').focus(); window.scrollTo(0, 0); return false; }
  if (window.LEESS && !LEESS.ok(name)) { $('#msg').textContent = LEESS.msg(); $('#name').focus(); window.scrollTo(0, 0); return false; } /*LEESS*/
  exst.set('name', name); $('#msg').textContent = ''; return true;
}
function renderLocked() {
  let saved = exst.get('name', ''); try { saved = saved || localStorage.getItem('leess-vname') || ''; } catch (e) {}
  $('#app').innerHTML = `<div class="lock"><h1>${esc(D.school)} ${esc(D.short)}</h1><p class="sub">${esc(D.sub)}</p>
  <div class="note"><b>교재 열기</b><p style="margin:6px 0 10px">본인 이름(실명)을 쓰고 「교재 열기」를 누르세요. 처음 쓰는 기기는 인터넷 연결이 필요합니다. ${esc(D.notice)}</p>
  <input type="text" id="name" placeholder="이름 (필수)" autocomplete="off" value="${esc(saved)}" style="width:100%;font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)">
  <p id="msg" style="color:var(--ng);font-size:14px;min-height:1.4em;margin:8px 0"></p>
  <button class="btn pri" id="openWb" style="width:100%;padding:10px">교재 열기</button></div></div>`;
  $('#openWb').onclick = openWb;
}
async function openWb() {
  if (!nameOk()) return;
  $('#msg').textContent = '서버에서 이름·기기를 확인하는 중…'; $('#openWb').disabled = true;
  const g = await gate(exst.get('name', ''), D.short + ' 열기');
  $('#openWb').disabled = false;
  if (!g.allow) { $('#msg').textContent = g.offline ? '서버에 연결하지 못했습니다. 통신 상태를 확인한 뒤 다시 시도하세요.' : (g.msg || '이 기기에서는 시작할 수 없습니다. 선생님께 문의하세요.'); return; }
  const u = await UNLOCK.run(D, g, KEYST);
  if (!u.ok) { $('#msg').textContent = u.msg; return; }
  if (u.key) IMGKEY = await UNLOCK.keyOf(u.key);
  renderBook();
}
async function boot() {
  if (D.enc && KEYST.get()) { const u = await UNLOCK.run(D, null, KEYST); if (u.ok) { if (u.key) IMGKEY = await UNLOCK.keyOf(u.key); renderBook(); return; } }
  renderLocked();
}
boot();
