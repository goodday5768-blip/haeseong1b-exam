<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">

<title>전주해성고 1학년 최종 정리 교재</title>
<style>
:root{--bg:#f8f7f3;--ink:#2a2838;--mute:#6f6d82;--line:#e8e6ef;--h1:#e4e1f7;--h2:#edeafa;--ht:#463d8f;--ng:#b5534a}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:calc(18px*var(--fz,1))/1.62 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
#app{max-width:1020px;margin:0 auto}a{color:inherit}
.lock{padding:26px 16px;max-width:520px;margin:0 auto}.lock h1{font-size:calc(25px*var(--fz,1));margin:6px 0;color:var(--ht)}.sub{color:var(--mute);font-size:calc(16px*var(--fz,1));margin:0 0 14px}
.note{background:#fff;border-radius:18px;padding:18px;box-shadow:0 4px 16px rgba(70,60,120,.08)}
.btn{font:inherit;font-weight:800;border:0;background:#fff;color:var(--ink);border-radius:12px;padding:9px 14px;cursor:pointer}.pri{background:linear-gradient(120deg,var(--h1),var(--h2));color:var(--ht)}
.hero{background:linear-gradient(125deg,#e4e0f7,#f8e2ea 60%,#fbecd9);color:#463d6f;padding:30px 20px 26px;border-radius:0 0 26px 26px}.hero small{font-size:calc(16px*var(--fz,1));font-weight:700;opacity:.92}.hero h1{font-size:calc(31px*var(--fz,1));line-height:1.25;margin:4px 0 8px}.hero p{margin:0;font-size:calc(16.5px*var(--fz,1));opacity:.95}
.home{padding:18px 14px 50px}.hh{font-size:calc(20px*var(--fz,1));font-weight:900;margin:8px 4px 12px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.gc{display:block;text-decoration:none;border-radius:20px;padding:20px;box-shadow:0 4px 12px rgba(70,60,120,.09)}.gc b{display:block;font-size:calc(26px*var(--fz,1));line-height:1.25}.gc span{font-size:calc(16px*var(--fz,1));font-weight:600;opacity:.95}
.res{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:14px 16px;margin:0 0 14px;font-weight:800;text-decoration:none;box-shadow:0 3px 10px rgba(70,60,120,.07)}.res i{font-style:normal;font-size:calc(24px*var(--fz,1))}.res em{margin-left:auto;font-style:normal;color:var(--ht)}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--h1),var(--h2));color:var(--ht);box-shadow:0 2px 8px rgba(70,60,120,.10)}
.tr{display:flex;align-items:center;gap:10px;padding:9px 12px}.tr b{font-size:calc(20px*var(--fz,1));flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bk{background:rgba(255,255,255,.7);color:var(--ht);font-size:calc(16px*var(--fz,1));padding:7px 12px;border-radius:11px;text-decoration:none;font-weight:800}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips a{flex:none;font-size:calc(15.5px*var(--fz,1));font-weight:800;text-decoration:none;color:var(--ht);background:rgba(255,255,255,.6);border-radius:999px;padding:5px 13px;white-space:nowrap}.chips a.on{background:#fff;color:var(--ht);box-shadow:inset 0 0 0 2px var(--ht)}
main{padding:12px 10px 60px}
article{background:#fff;border-radius:22px;margin:0 0 28px;overflow:hidden;box-shadow:0 4px 16px rgba(70,60,120,.08);scroll-margin-top:112px}
.ah{background:linear-gradient(120deg,var(--h1),var(--h2));color:var(--ht);padding:14px 18px;font-size:calc(23px*var(--fz,1));font-weight:900;line-height:1.3}.ah small{display:block;font-size:calc(15.5px*var(--fz,1));font-weight:700;opacity:.92}
.inner{padding:14px}
.sum{display:grid;gap:10px;margin-bottom:18px}
.sc{border-radius:16px;padding:12px 14px;border-left:8px solid}.sc .l{display:inline-block;font-size:calc(15.5px*var(--fz,1));font-weight:900;border-radius:8px;padding:1px 11px;margin-bottom:5px}.sc .k{font-size:calc(21px*var(--fz,1));font-weight:900;line-height:1.42}.sc .e{font-size:calc(17px*var(--fz,1));color:#55536e;line-height:1.45;margin-top:3px}
.sc.t{background:#f4f1fc;border-color:#c5b8ec}.sc.t .l{background:#e4dcf7;color:#4f3a96}.sc.t .k{color:#4f3a96}
.sc.p{background:#eef8f5;border-color:#a5d9ce}.sc.p .l{background:#d5efe8;color:#22695e}.sc.p .k{color:#22695e}
.sc.g{background:#fdf5ea;border-color:#f1cfa3}.sc.g .l{background:#fae5ca;color:#8a5a1c}.sc.g .k{color:#8a5a1c}
.sh{display:flex;align-items:center;gap:9px;font-size:calc(22px*var(--fz,1));font-weight:900;border-radius:14px;padding:9px 15px;margin:22px 0 11px}
.sh.ps{background:linear-gradient(120deg,#e2e6f8,#eef0fb);color:#3c4a8e}.sh.gr{background:linear-gradient(120deg,#f9e2eb,#fcedf2);color:#953a60}.sh.vo{background:linear-gradient(120deg,#dcf1e4,#eaf7ef);color:#2a6e49}.sh.fl{background:linear-gradient(120deg,#fce7d6,#fef1e5);color:#9a5220}
.sr{display:grid;grid-template-columns:42px 1fr 1fr;border-bottom:1px solid var(--line);position:relative}.sr:last-child{border-bottom:0}
.no{font-size:calc(23px*var(--fz,1));font-weight:900;color:#6470ad;padding:11px 0 11px 5px;line-height:1.3}.en{padding:11px 12px 11px 2px;font-size:calc(19.5px*var(--fz,1));line-height:1.56}.ko{padding:11px 12px;background:#f6f6fb;font-size:calc(18px*var(--fz,1));line-height:1.56;color:#3a3852}
.sr.st{background:#fff8dc;border:2px solid #f0d596;border-radius:14px;margin:8px 0;padding-top:30px}.sr.st .ko{background:transparent;color:#4a3a14;font-weight:600}.sr.st .no{color:#a8682c}.sr.st .en{font-weight:600}
.stag{position:absolute;left:0;top:0;background:#f7e2b4;color:#7a5214;font-size:calc(16px*var(--fz,1));font-weight:900;padding:3px 14px;border-radius:9px 0 12px 0}
mark{background:#fbe8ef;color:#9c3a63;font-weight:800;border-radius:5px;padding:0 3px;border-bottom:2px solid #e8afc6}mark sup{font-size:.68em;color:#b5597f;margin-left:1px;font-weight:900}
b.v{color:#2f7a52;font-weight:900;background:#e7f6ee;border-radius:5px;padding:0 3px}
.gi{display:flex;gap:11px;align-items:flex-start;background:#fdf6f9;border:2px solid #f5dfe8;border-radius:15px;padding:12px 14px;margin:9px 0}.gi .n{flex:none;width:36px;height:36px;border-radius:50%;background:#f5dae5;color:#8f3a5e;font-size:calc(20px*var(--fz,1));font-weight:900;display:flex;align-items:center;justify-content:center}.gi .q{font-size:calc(21px*var(--fz,1));font-weight:900;color:#953a60;line-height:1.38}.gi .w{font-size:calc(19px*var(--fz,1));line-height:1.55;margin-top:2px}.gi .sn{color:#6470ad;font-weight:900}
.vi{background:#f5fbf7;border:2px solid #dcefe3;border-radius:15px;padding:12px 14px;margin:9px 0}.vi .wd{font-size:calc(24px*var(--fz,1));font-weight:900;color:#2f7a52;margin-right:9px}.vi .m{font-size:calc(20px*var(--fz,1));font-weight:800}
.tg{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}.tg span{font-size:calc(18px*var(--fz,1));font-weight:700;border-radius:999px;padding:3px 13px}.tg .y{background:#d9f0e3;color:#256b47}.tg .a{background:#f8dfdf;color:#a13c3c}
.st0{background:#fdf7ee;border:2px solid #f3dcbd;border-radius:17px;padding:13px 15px}.st0 .h{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:6px}.st0 .rg{font-size:calc(22px*var(--fz,1));font-weight:900;color:#a85f28}.st0 .tt{background:#f9e2c9;color:#8a5020;font-size:calc(17px*var(--fz,1));font-weight:900;border-radius:9px;padding:2px 12px}.st0 .x{font-size:calc(20px*var(--fz,1));font-weight:600;line-height:1.56;color:#4a3622}
.lk{display:flex;gap:9px;align-items:flex-start;margin:5px 0 5px 12px;padding:9px 12px;font-size:calc(18px*var(--fz,1));line-height:1.5}.lk .ar{font-size:calc(26px*var(--fz,1));font-weight:900;color:#c98a5a;line-height:1}.lk .cu{display:inline-block;background:#e7e1f7;color:#4f3a96;font-weight:800;border-radius:8px;padding:0 9px;margin-right:6px;font-size:calc(18px*var(--fz,1))}
@media(max-width:640px){body{font-size:calc(17.5px*var(--fz,1))}.sr{grid-template-columns:36px 1fr}.en{grid-column:2;padding:10px 8px 6px 0}.ko{grid-column:2;border-radius:10px;margin:0 8px 10px 0;padding:8px 10px}.sr.st .ko{margin-bottom:8px}.ah{font-size:calc(21px*var(--fz,1))}.hero h1{font-size:calc(27px*var(--fz,1))}main{padding:10px 6px 60px}.inner{padding:11px}}
</style>

/* 콘텐츠 보호(2026-10-06) — 공용 조각(examapp/unlock.js). 빌더(content_crypt.inject)가 각 틀의 UNLOCK 표식 자리에 넣는다.

   UNLOCK.run(D, g, st[, target]): {ok:true, key}면 풀린 내용이 target(기본 D)에 합쳐진 뒤, {ok:false, msg}면 msg를 학생에게 보인다.
   st = {get(), set(v), del()} 열쇠 저장소(엔진마다 localStorage 이름공간이 달라 밖에서 준다). D.enc가 없는 옛 페이지는 그대로 통과.
   그림: <img data-enc="경로.bin"> 을 UNLOCK.lazy(root, cryptoKey)가 보일 때 받아 풀어 blob 주소로 넣는다(.bin이 아니면 그대로 src).
   음원(2026-11-02): <audio data-enc="경로.bin" data-type="audio/mp4"> 도 같은 방식(보일 때 받아 풀어 src). */
const UNLOCK = (() => {

    return JSON.parse(await new Response(s).text());
  }
  const MSG_NET = '처음 쓰는 기기는 인터넷 연결이 필요합니다. 통신 상태를 확인한 뒤 다시 시도하세요.';
  const MSG_SRV = '지금은 시작할 수 없습니다. 선생님께 문의하세요.';
  const MSG_FAIL = '내용을 여는 데 실패했습니다. 앱을 새로 고친 뒤 다시 시도하세요.';
  const MSG_OLD = '이 브라우저에서는 열 수 없습니다. 최신 Safari 또는 Chrome으로 여세요.';
  const able = () => !!(window.isSecureContext && window.crypto && crypto.subtle && typeof DecompressionStream !== 'undefined');
